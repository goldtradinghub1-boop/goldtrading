<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gold Trading — Test Page</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, #2a2410 0%, #0d0b07 70%);
      color: #f5e6b8;
    }
    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      background: rgba(20, 18, 10, 0.6);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
    }
    h1 {
      font-size: 2.25rem;
      background: linear-gradient(90deg, #d4af37, #f9e27f, #d4af37);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.75rem;
    }
    p { opacity: 0.8; font-size: 1rem; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.4);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Gold Trading</h1>
    <p>Test page is live and working.</p>
    <span class="badge">Deployed via GitHub Pages</span>
  </main>
</body>
</html>
